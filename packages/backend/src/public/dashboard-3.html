<!-- Duplicated and Delete controls restored and canvas cleaned -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f112b;
            color: #fff;
            margin: 0;
        }
        .sidebar {
            height: 100vh;
            background: #15173c;
            color: #fff;
            padding: 1.5rem 0.75rem;
            font-size: 0.875rem;
        }
        .sidebar .nav-link {
            color: #ccc;
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.75rem;
        }
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: #1e204d;
            border-radius: 0.375rem;
        }
        .card-custom {
            border-radius: 0.75rem;
            background: #1e204d;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            cursor: move;
            position: absolute;
            width: 250px;
        }
        .control-buttons {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 10;
        }
        .badge-custom {
            background: #00b8ff;
            border-radius: 999px;
            font-size: 0.75rem;
        }
        .progress-bar-custom1 { background: #ff5c8d; }
        .progress-bar-custom2 { background: #825afd; }
        canvas {
            background-color: transparent !important;
        }
        .text-sm { font-size: 0.75rem; }
        .draggable {
            position: absolute;
        }
        #canvas-area {
            position: relative;
            width: 100%;
            height: calc(100vh - 2rem);
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-2 sidebar d-flex flex-column">
            <div class="mb-4 text-center">
                <h6><i class="bi bi-circle-fill text-danger"></i> LOGO</h6>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="#">📘 Ipsum dolor</a>
                <a class="nav-link" href="#">📘 Sit amet</a>
                <a class="nav-link" href="#">📘 Lorem ipsum</a>
                <a class="nav-link" href="#">📘 Dolor sit</a>
                <a class="nav-link" href="#">📘 Amet lorem</a>
            </nav>
        </div>
        <div class="col-10 p-3">
            <div id="canvas-area">
                <div class="draggable card-custom" style="top: 50px; left: 20px;">
                    <div class="control-buttons">
                        <button class="btn btn-sm btn-outline-light duplicate-btn">📄</button>
                        <button class="btn btn-sm btn-outline-danger delete-btn">🗑</button>
                    </div>
                    <canvas id="radialChart" width="200" height="200"></canvas>
                </div>
                <div class="draggable card-custom" style="top: 300px; left: 20px;">
                    <div class="control-buttons">
                        <button class="btn btn-sm btn-outline-light duplicate-btn">📄</button>
                        <button class="btn btn-sm btn-outline-danger delete-btn">🗑</button>
                    </div>
                    <canvas id="barChart" width="200" height="150"></canvas>
                </div>
                <div class="draggable card-custom" style="top: 550px; left: 20px;">
                    <div class="control-buttons">
                        <button class="btn btn-sm btn-outline-light duplicate-btn">📄</button>
                        <button class="btn btn-sm btn-outline-danger delete-btn">🗑</button>
                    </div>
                    <canvas id="lineChart" width="200" height="150"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const getCtx = id => {
            const el = document.getElementById(id);
            return el ? el.getContext('2d') : null;
        };

        const radial = getCtx('radialChart');
        if (radial) {
            new Chart(radial, {
                type: 'doughnut',
                data: {
                    datasets: [{ data: [75, 25], backgroundColor: ['#00b8ff', '#1e204d'], cutout: '70%' }]
                },
                options: { plugins: { legend: { display: false } }, responsive: false }
            });
        }

        const bar = getCtx('barChart');
        if (bar) {
            new Chart(bar, {
                type: 'bar',
                data: {
                    labels: ['Red', 'Blue', 'Yellow', 'Green'],
                    datasets: [{
                        label: 'Votes',
                        data: [12, 19, 3, 5],
                        backgroundColor: ['#ff5c8d', '#00b8ff', '#ffc107', '#20c997']
                    }]
                },
                options: { plugins: { legend: { display: false } }, responsive: false }
            });
        }

        const line = getCtx('lineChart');
        if (line) {
            new Chart(line, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                    datasets: [{
                        label: 'Sales',
                        data: [10, 15, 12, 18, 20],
                        borderColor: '#825afd',
                        fill: false,
                        tension: 0.4
                    }]
                },
                options: { plugins: { legend: { display: false } }, responsive: false }
            });
        }

        let dragged;
        const makeDraggable = el => {
            el.draggable = true;
            el.addEventListener('dragstart', () => dragged = el);
        };

        document.querySelectorAll('.draggable').forEach(makeDraggable);

        const canvasArea = document.getElementById('canvas-area');
        canvasArea.addEventListener('dragover', e => e.preventDefault());
        canvasArea.addEventListener('drop', e => {
            e.preventDefault();
            if (!dragged) return;
            dragged.style.left = e.offsetX + 'px';
            dragged.style.top = e.offsetY + 'px';
        });

        document.addEventListener('click', e => {
            if (e.target.classList.contains('delete-btn')) {
                e.target.closest('.draggable').remove();
            } else if (e.target.classList.contains('duplicate-btn')) {
                const original = e.target.closest('.draggable');
                const clone = original.cloneNode(true);
                clone.style.top = (parseInt(original.style.top) + 30) + 'px';
                clone.style.left = (parseInt(original.style.left) + 30) + 'px';
                const canvas = clone.querySelector('canvas');
                if (canvas) {
                    const newId = 'chart_' + Math.random().toString(36).substr(2, 9);
                    canvas.id = newId;
                    setTimeout(() => {
                        const ctx = canvas.getContext('2d');
                        const type = original.querySelector('canvas').id;
                        if (type.includes('radial')) {
                            new Chart(ctx, {
                                type: 'doughnut',
                                data: {
                                    datasets: [{ data: [75, 25], backgroundColor: ['#00b8ff', '#1e204d'], cutout: '70%' }]
                                },
                                options: { plugins: { legend: { display: false } }, responsive: false }
                            });
                        } else if (type.includes('bar')) {
                            new Chart(ctx, {
                                type: 'bar',
                                data: {
                                    labels: ['Red', 'Blue', 'Yellow', 'Green'],
                                    datasets: [{
                                        label: 'Votes',
                                        data: [12, 19, 3, 5],
                                        backgroundColor: ['#ff5c8d', '#00b8ff', '#ffc107', '#20c997']
                                    }]
                                },
                                options: { plugins: { legend: { display: false } }, responsive: false }
                            });
                        } else if (type.includes('line')) {
                            new Chart(ctx, {
                                type: 'line',
                                data: {
                                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                                    datasets: [{
                                        label: 'Sales',
                                        data: [10, 15, 12, 18, 20],
                                        borderColor: '#825afd',
                                        fill: false,
                                        tension: 0.4
                                    }]
                                },
                                options: { plugins: { legend: { display: false } }, responsive: false }
                            });
                        }
                    }, 100);
                }
                canvasArea.appendChild(clone);
                makeDraggable(clone);
            }
        });
    });
</script>
</body>
</html>
