<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f112b;
            color: #fff;
            margin: 0;
        }
        .sidebar {
            height: 100vh;
            background: #15173c;
            color: #fff;
            padding: 1.5rem 0.75rem;
            font-size: 0.875rem;
        }
        .sidebar .nav-link {
            color: #ccc;
            margin-bottom: 0.75rem;
            padding: 0.5rem 0.75rem;
        }
        .sidebar .nav-link:hover {
            color: #fff;
            background-color: #1e204d;
            border-radius: 0.375rem;
        }
        .card-custom {
            border-radius: 0.75rem;
            background: #1e204d;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            cursor: move;
        }
        .badge-custom {
            background: #00b8ff;
            border-radius: 999px;
            font-size: 0.75rem;
        }
        .progress-bar-custom1 { background: #ff5c8d; }
        .progress-bar-custom2 { background: #825afd; }
        canvas {
            background-color: transparent !important;
        }
        .text-sm { font-size: 0.75rem; }
        .row.g-3 {
            display: flex;
            flex-wrap: wrap;
        }
        .draggable {
            position: relative;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-2 sidebar d-flex flex-column">
            <div class="mb-4 text-center">
                <h6><i class="bi bi-circle-fill text-danger"></i> LOGO</h6>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="#">📘 Ipsum dolor</a>
                <a class="nav-link" href="#">📘 Sit amet</a>
                <a class="nav-link" href="#">📘 Lorem ipsum</a>
                <a class="nav-link" href="#">📘 Dolor sit</a>
                <a class="nav-link" href="#">📘 Amet lorem</a>
            </nav>
            <div class="mt-auto text-center">
                <canvas id="radialChart" width="100" height="100"></canvas>
                <p class="text-sm">LOREM IPSUM DOLOR</p>
            </div>
        </div>
        <div class="col-10 p-3">
            <div class="row g-3" id="draggable-container">
                <div class="col-md-2 draggable"><div class="card-custom text-center"><p class="mb-1">Dolor sit amet</p><span class="badge badge-custom px-2 py-1">3,709</span></div></div>
                <div class="col-md-2 draggable"><div class="card-custom text-center"><p class="mb-1">Dolor sit amet</p><span class="badge badge-custom px-2 py-1">2,367</span></div></div>
                <div class="col-md-2 draggable"><div class="card-custom text-center"><p class="mb-1">Dolor sit amet</p><span class="badge badge-custom px-2 py-1">6,897</span></div></div>
                <div class="col-md-3 draggable"><div class="card-custom"><canvas id="gauge1" width="100" height="100"></canvas><p class="text-center mt-1">51%</p></div></div>
                <div class="col-md-3 draggable"><div class="card-custom"><canvas id="gauge2" width="100" height="100"></canvas><p class="text-center mt-1">28%</p></div></div>
                <div class="col-md-4 draggable"><div class="card-custom"><canvas id="areaChart1" height="100"></canvas></div></div>
                <div class="col-md-2 draggable"><div class="card-custom"><p class="mb-1">LOREM IPSUM DOLOR</p><div class="form-check mb-1"><input class="form-check-input" type="radio" name="exampleRadios" id="radio1" checked><label class="form-check-label text-sm" for="radio1">Option 1</label></div><div class="form-check"><input class="form-check-input" type="radio" name="exampleRadios" id="radio2"><label class="form-check-label text-sm" for="radio2">Option 2</label></div></div></div>
                <div class="col-md-3 draggable"><div class="card-custom"><canvas id="barChart" height="100"></canvas></div></div>
                <div class="col-md-3 draggable"><div class="card-custom"><div class="mb-2">Lorem <span class="float-end">55%</span></div><div class="progress mb-3" style="height: 6px;"><div class="progress-bar progress-bar-custom1" style="width: 55%"></div></div><div class="mb-2">Lorem <span class="float-end">76%</span></div><div class="progress" style="height: 6px;"><div class="progress-bar progress-bar-custom2" style="width: 76%"></div></div></div></div>
                <div class="col-md-6 draggable"><div class="card-custom"><canvas id="lineChart" height="120"></canvas></div></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const createGauge = (id, value, color) => {
        new Chart(document.getElementById(id), {
            type: 'doughnut',
            data: {
                datasets: [{ data: [value, 100 - value], backgroundColor: [color, '#343a40'], cutout: '80%' }]
            },
            options: { responsive: false, plugins: { legend: { display: false } } }
        });
    };

    createGauge('radialChart', 75, '#ff2d7d');
    createGauge('gauge1', 51, '#ff2d7d');
    createGauge('gauge2', 28, '#8d6bff');

    new Chart(document.getElementById('areaChart1'), {
        type: 'line',
        data: {
            labels: ['1', '2', '3', '4', '5', '6'],
            datasets: [{
                data: [30, 60, 40, 80, 50, 90],
                fill: true,
                backgroundColor: 'rgba(0,184,255,0.2)',
                borderColor: '#00b8ff',
                tension: 0.4
            }]
        },
        options: { plugins: { legend: { display: false } } }
    });

    new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
            labels: ['A', 'B', 'C', 'D', 'E', 'F'],
            datasets: [{
                data: [12, 19, 3, 5, 2, 3],
                backgroundColor: ['#ff5c8d', '#ff2d7d', '#00b8ff', '#825afd', '#ffc107', '#20c997']
            }]
        },
        options: { plugins: { legend: { display: false } } }
    });

    new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            datasets: [{
                label: '425',
                data: [300, 350, 270, 420, 380, 425, 390],
                borderColor: '#ff2d7d',
                fill: false,
                tension: 0.4
            }]
        },
        options: { plugins: { legend: { display: true } } }
    });

    let dragged;
    document.querySelectorAll('.draggable').forEach(el => {
        el.draggable = true;
        el.addEventListener('dragstart', e => dragged = el);
        el.addEventListener('dragover', e => e.preventDefault());
        el.addEventListener('drop', e => {
            e.preventDefault();
            const target = e.target.closest('.draggable');
            if (!target || dragged === target) return;
            const container = document.getElementById('draggable-container');
            const draggedIndex = [...container.children].indexOf(dragged);
            const targetIndex = [...container.children].indexOf(target);
            if (draggedIndex < targetIndex) {
                container.insertBefore(dragged, target.nextSibling);
            } else {
                container.insertBefore(dragged, target);
            }
        });
    });
</script>
</body>
</html>
