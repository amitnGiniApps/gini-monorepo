
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatPage App - Two Screens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f0f0f5; }
    video::-internal-media-controls-download-button { display:none; }
    video::-webkit-media-controls-enclosure { overflow:hidden; }
    video::-webkit-media-controls-panel { width: calc(100% + 30px); }
  </style>
</head>
<body style="height: 600px" class="min-h-screen flex justify-center items-start gap-6 p-6 overflow-x-auto">

<!-- ChatPage List Screen -->
<div class="max-w-md w-full msn-h-screen bg-[#f8f8fe] p-4 rounded-2xl border border-gray-200 shadow-md">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-semibold">Gini ChatPage</h1>
    <span class="text-sm text-gray-500">19:02</span>
  </div>
  <div class="relative mb-4">
    <input placeholder="Search Message" class="pl-10 w-full py-2 border rounded-md" />
    <div class="absolute left-3 top-2.5 h-5 w-5 text-gray-500">🔍</div>
  </div>
  <div class="flex mb-4 bg-white rounded-lg overflow-hidden">
    <button class="w-1/2 py-2 bg-indigo-600 text-white">Personal</button>
    <button class="w-1/2 py-2 text-gray-600">Group</button>
  </div>
  <div class="h-[75vh] overflow-y-auto space-y-2">
    <div class="flex items-center p-2 bg-white rounded shadow">
      <div class="w-12 h-12 rounded-full bg-gray-300 mr-3"></div>
      <div class="flex-1">
        <div class="flex justify-between">
          <span class="font-semibold text-sm">Bambang P <span class="text-green-500">•</span></span>
          <span class="text-xs text-gray-500">12:13 PM</span>
        </div>
        <div class="text-sm text-gray-600">Hey, how are you?</div>
      </div>
      <div class="ml-2 text-xs bg-indigo-600 text-white rounded-full w-5 h-5 flex items-center justify-center">1</div>
    </div>
    <div class="flex items-center p-2 bg-white rounded shadow">
      <div class="w-12 h-12 rounded-full bg-gray-300 mr-3"></div>
      <div class="flex-1">
        <div class="flex justify-between">
          <span class="font-semibold text-sm">Suri <span class="text-green-500">•</span></span>
          <span class="text-xs text-gray-500">12:13 PM</span>
        </div>
        <div class="text-sm text-gray-600">📄 Video.mp4</div>
      </div>
      <div class="ml-2 text-xs bg-indigo-600 text-white rounded-full w-5 h-5 flex items-center justify-center">2</div>
    </div>
  </div>
  <button class="fixed bottom-20 right-6 rounded-full w-12 h-12 shadow-lg bg-indigo-600 text-white text-lg">+</button>
</div>

<!-- ChatPage Conversation Screen -->
<div class="max-w-md w-full flex flex-col justify-between bg-white rounded-2xl border border-gray-200 shadow-md overflow-hidden">
  <div class="flex items-center px-4 py-3 bg-violet-100">
    <div class="w-10 h-10 rounded-full bg-gray-300 mr-2"></div>
    <div class="flex-1">
      <div class="font-semibold">Humaira S</div>
      <div class="text-xs text-green-600">Online</div>
    </div>
    <div class="flex gap-2 text-violet-600">
      <button>📞</button>
      <button>🎥</button>
      <button>⋮</button>
    </div>
  </div>
  <div class="flex-1 overflow-y-auto p-4 space-y-4">
    <div class="flex justify-end">
      <div class="max-w-xs rounded-xl p-2 text-sm bg-indigo-600 text-white">
        Hey, good morning! ☀️
        <div class="text-[10px] mt-1 text-right opacity-70">11:08 PM</div>
      </div>
    </div>
    <div class="flex justify-start">
      <div class="max-w-xs rounded-xl p-2 text-sm bg-gray-100 text-black">
        Morning!
        <div class="text-[10px] mt-1 text-right opacity-70">11:08 PM</div>
      </div>
    </div>
    <div class="flex justify-end">
      <div class="max-w-xs rounded-xl p-2 text-sm bg-indigo-600 text-white">
        I wanna show you ...
        <div class="text-[10px] mt-1 text-right opacity-70">11:08 PM</div>
      </div>
    </div>
    <div class="flex justify-end">
      <div class="max-w-xs">
        <img src="https://via.placeholder.com/300x200.png?text=Gaming+Laptop" alt="Gaming Laptop" class="rounded-lg" />
        <div class="text-[10px] mt-1 text-right opacity-70 text-gray-500">11:08 PM</div>
      </div>
    </div>
    <div class="flex justify-start">
      <div class="max-w-xs rounded-xl p-2 text-sm bg-gray-100 text-black">
        Great! finally you bought it!
        <div class="text-[10px] mt-1 text-right opacity-70">11:08 PM</div>
      </div>
    </div>
    <div class="flex justify-end">
      <div class="max-w-xs rounded-xl p-2 text-sm bg-indigo-600 text-white">
        Thank you! let's play game
        <div class="text-[10px] mt-1 text-right opacity-70">11:08 PM</div>
      </div>
    </div>
    <div class="flex justify-end">
      <div class="max-w-xs relative">
        <video controls class="rounded-lg" width="240">
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
        <span class="absolute bottom-2 right-2 text-white text-xs bg-black bg-opacity-50 px-1 rounded">00:08</span>
      </div>
    </div>
  </div>
  <div class="flex items-center p-3 bg-gray-100">
    <input
            class="flex-1 p-2 rounded-full bg-white border border-gray-300 text-sm"
            placeholder="Hey, good morning!"
    />
    <button class="ml-2 text-xl text-indigo-600">🎤</button>
    <button class="ml-2 text-xl text-indigo-600">📎</button>
    <button class="ml-2 bg-indigo-600 text-white rounded-full w-8 h-8 flex items-center justify-center">➤</button>
  </div>
</div>

</body>
</html>
