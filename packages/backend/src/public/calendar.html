<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Calendar App</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        #calendar {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 10px;
        }
    </style>
</head>
<body>
<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            initialDate: '2017-05-01',
            events: [
                { title: 'Oil Painting for Beginners', start: '2017-05-01', color: '#f06292' },
                { title: 'Testing', start: '2017-05-01', color: '#ba68c8' },
                { title: 'Watercolor', start: '2017-05-02', color: '#fdd835' },
                { title: 'Meeting of Instructors', start: '2017-05-03', color: '#ff8a65' },
                { title: 'Oil Painting for Beginners', start: '2017-05-04', color: '#f06292' },
                { title: 'Watercolor', start: '2017-05-05', color: '#fdd835' },
                { title: 'Oil Painting for Beginners', start: '2017-05-08', color: '#f06292' },
                { title: 'Meeting of Instructors', start: '2017-05-10', color: '#ff8a65' },
                { title: 'Watercolor', start: '2017-05-12', color: '#fdd835' },
                { title: 'Oil Painting for Beginners', start: '2017-05-15', color: '#f06292' },
                { title: 'Watercolor', start: '2017-05-16', color: '#fdd835' },
                { title: 'Testing', start: '2017-05-22', color: '#ba68c8' },
                { title: 'Oil Painting for Beginners', start: '2017-05-22', color: '#f06292' },
                { title: 'Watercolor', start: '2017-05-23', color: '#fdd835' },
                { title: 'Oil Painting for Beginners', start: '2017-05-29', color: '#f06292' },
                { title: 'Watercolor', start: '2017-05-30', color: '#fdd835' },
                { title: 'Meeting of Instructors', start: '2017-05-31', color: '#ff8a65' },
                { title: 'Recruiting Seminar', start: '2017-06-05', color: '#4db6ac' },
                { title: 'Recruiting Seminar', start: '2017-06-06', color: '#4db6ac' },
                { title: 'Recruiting Seminar', start: '2017-06-07', color: '#4db6ac' },
                { title: 'Recruiting Seminar', start: '2017-06-08', color: '#4db6ac' },
                { title: 'Recruiting Seminar', start: '2017-06-09', color: '#4db6ac' },
                { title: 'Open Day', start: '2017-05-28', color: '#26a69a' },
                { title: 'Monthly Planning', start: '2017-05-27', color: '#ef9a9a' },
                {
                    title: 'Oil Painting for Beginners',
                    start: '2017-05-18T09:30:00',
                    end: '2017-05-18T11:00:00',
                    color: '#f06292',
                    extendedProps: {
                        location: 'Room 102',
                        instructor: 'Arnie Schwartz'
                    },
                    description: 'Oil Painting for Beginners (Room 102) with Arnie Schwartz'
                }
            ],
            eventClick: function(info) {
                const event = info.event;
                alert(
                    `${event.title}\nDate: ${event.start.toLocaleDateString()}\nTime: ${event.start.toLocaleTimeString()}\nLocation: ${event.extendedProps.location || 'N/A'}\nInstructor: ${event.extendedProps.instructor || 'N/A'}`
                );
            }
        });
        calendar.render();
    });
</script>
</body>
</html>
