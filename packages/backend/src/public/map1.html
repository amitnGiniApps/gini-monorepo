<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>GIS Dashboard (No API Key)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ✅ Leaflet CSS without integrity -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: sans-serif;
        }
        #index {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .sidebar {
            width: 320px;
            background-color: #f5f5f5;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
        }
        .sidebar h2 {
            margin-top: 0;
        }
        .sidebar button {
            margin-right: 10px;
            margin-bottom: 20px;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        .sidebar .preview-btn {
            background-color: #eee;
            color: black;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .btn {
            background-color: #e0e0e0;
            padding: 10px;
            text-align: center;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        #map {
            flex-grow: 1;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="index">
    <div class="sidebar">
        <h2>APP BUILDER</h2>
        <button class="save-btn">Save</button>
        <button class="preview-btn">Preview</button>

        <div class="section-title">MAP</div>
        <div class="section-title">TOOLBAR</div>

        <div class="btn-grid">
            <div class="btn">Search</div>
            <div class="btn">Show/Hide Toolbar</div>
            <div class="btn">Layer List</div>
            <div class="btn">Zoom To Current</div>
            <div class="btn">Zoom</div>
            <div class="btn">Zoom In</div>
            <div class="btn">Zoom Out</div>
            <div class="btn">View Entire Map</div>
            <div class="btn">Select</div>
            <div class="btn">Info</div>
            <div class="btn">Measure tools</div>
            <div class="btn">Area Selection</div>
            <div class="btn">Print</div>
            <div class="btn">Show Coordinates</div>
            <div class="btn">Google Street View</div>
            <div class="btn">Show Scale</div>
        </div>
    </div>
    <div id="map"></div>
</div>

</body>
</html>
