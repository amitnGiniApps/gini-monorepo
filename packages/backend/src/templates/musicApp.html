<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            color: white;
        }
        .player-container {
            width: 300px;
            background: linear-gradient(to bottom, #2e004d, #000);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }
        .album-art {
            width: 100%;
            border-radius: 20px;
        }
        .song-title {
            font-size: 1.2rem;
            margin: 15px 0 5px;
        }
        .artist-name {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
        }
        .time {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin: 5px 0;
        }
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
        }
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .play-button {
            background: #a855f7;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 0 15px #a855f7;
            color: white;
        }
        .volume-control {
            margin-top: 10px;
        }
        .volume-control input {
            width: 100%;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #555;
            border-radius: 3px;
            cursor: pointer;
            margin: 10px 0;
            position: relative;
        }
        .progress-filled {
            height: 100%;
            background: #a855f7;
            border-radius: 3px;
            width: 0%;
        }
        .boxContainer {
            display: flex;
            justify-content: space-between;
            height: 64px;
            --boxSize: 8px;
            --gutter: 4px;
            width: 100%;
            margin-top: 20px;
        }
        .box {
            transform: scaleY(.4);
            height: 100%;
            width: var(--boxSize);
            background: #a855f7;
            animation-duration: 1.2s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            border-radius: 8px;
        }
        .box:nth-child(4n+1) { animation-name: quiet; }
        .box:nth-child(4n+2) { animation-name: normal; }
        .box:nth-child(4n+3) { animation-name: loud; }
        .box:nth-child(4n)   { animation-name: quiet; }

        @keyframes quiet {
            25% { transform: scaleY(.3); }
            50% { transform: scaleY(.2); }
            75% { transform: scaleY(.4); }
        }
        @keyframes normal {
            25% { transform: scaleY(.6); }
            50% { transform: scaleY(.3); }
            75% { transform: scaleY(.5); }
        }
        @keyframes loud {
            25% { transform: scaleY(1); }
            50% { transform: scaleY(.4); }
            75% { transform: scaleY(1.2); }
        }
    </style>
</head>
<body>
<div class="player-container">
    <img class="album-art" src="https://upload.wikimedia.org/wikipedia/en/b/b7/NirvanaNevermindalbumcover.jpg" alt="Album Art">
    <div class="song-title">Smells Like Teen Spirit</div>
    <div class="artist-name">Nirvana</div>
    <div class="boxContainer" id="boxContainer"></div>
    <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" controls style="display: none"></audio>
<!--    <div class="time">-->
<!--        <span id="current-time">0:00</span>-->
<!--        <span id="duration">0:00</span>-->
<!--    </div>-->
<!--    <div class="progress-bar" onclick="seek(event)">-->
<!--        <div id="progress-filled" class="progress-filled"></div>-->
<!--    </div>-->
    <div class="controls">
        <button class="control-btn" onclick="skip(-10)"><i class="bi bi-skip-start-fill"></i></button>
        <div class="play-button" onclick="togglePlay()"><i id="play-icon" class="bi bi-play-fill"></i></div>
        <button class="control-btn" onclick="skip(10)"><i class="bi bi-skip-end-fill"></i></button>
    </div>
</div>

<script>
    const audio = document.getElementById('audio');
    const playIcon = document.getElementById('play-icon');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const volumeSlider = document.getElementById('volume-slider');
    const progressFilled = document.getElementById('progress-filled');
    const progressBar = document.querySelector('.progress-bar');
    const boxContainer = document.getElementById('boxContainer');

    // Create more boxes to fill the width
    for (let i = 0; i < 30; i++) {
        const box = document.createElement('div');
        box.classList.add('box');
        boxContainer.appendChild(box);
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play();
            playIcon.className = 'bi bi-pause-fill';
        } else {
            audio.pause();
            playIcon.className = 'bi bi-play-fill';
        }
    }

    function skip(seconds) {
        audio.currentTime += seconds;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateProgress() {
        const percentage = (audio.currentTime / audio.duration) * 100;
        progressFilled.style.width = `${percentage}%`;
    }

    function seek(event) {
        const rect = progressBar.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const percentage = x / rect.width;
        audio.currentTime = percentage * audio.duration;
    }

    audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        updateProgress();
    });

    volumeSlider.addEventListener('input', () => {
        audio.volume = volumeSlider.value;
    });

    // Autoplay on load
    window.addEventListener('load', () => {
        audio.play().catch(err => console.log('Autoplay failed:', err));
        playIcon.className = 'bi bi-pause-fill';
    });
</script>
</body>
</html>
